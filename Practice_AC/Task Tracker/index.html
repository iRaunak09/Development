<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="item" id="addTask">ADD TASK</div>
        <hr>

        <form class="item" id="inp">
            <button type="submit" id="btn" ><label for="input">Add Task</label></button>
            <input id="input" type="text" name="task">
        </form>

        <div class="item" id="todo">
            <div id="heading">TODO</div>
            <div id="todoList"></div>
        </div>
        <hr>

        <div class="item" id="completedTasks">COMPLETED TASKS</div>
        <hr>
    </div>

    <script src="script.js"></script>
</body>
</html>
